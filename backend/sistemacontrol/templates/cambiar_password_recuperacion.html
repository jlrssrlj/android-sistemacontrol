{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-secondary-subtle d-flex align-items-center justify-content-center vh-100">

<div class="bg-white p-4 shadow-lg rounded-4" style="max-width: 420px; width: 100%;">
    <h3 class="text-center text-primary mb-3">
        <i class="bi bi-shield-lock me-2"></i>Nueva contraseña
    </h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% if token_valido %}
        <form method="post">
            {% csrf_token %}

            <label for="id_password1" class="form-label">Nueva contraseña</label>
            <input type="password" name="password1" id="id_password1" class="form-control mb-3" required>

            <label for="id_password2" class="form-label">Confirmar contraseña</label>
            <input type="password" name="password2" id="id_password2" class="form-control mb-4" required>

            <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
        </form>
    {% else %}
        <div class="alert alert-danger" role="alert">
            El enlace de recuperación no es válido o ya expiró.
        </div>
        <a href="{% url 'solicitar_recuperacion_password' %}" class="btn btn-primary w-100">
            Solicitar otro enlace
        </a>
    {% endif %}

    <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="text-decoration-none">Volver al login</a>
    </div>
</div>

<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
