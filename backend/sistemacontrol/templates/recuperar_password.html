{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-secondary-subtle d-flex align-items-center justify-content-center vh-100">

<form method="post" class="bg-white p-4 shadow-lg rounded-4" style="max-width: 420px; width: 100%;">
    {% csrf_token %}

    <h3 class="text-center text-primary mb-3">
        <i class="bi bi-key me-2"></i>Recuperar contraseña
    </h3>

    <p class="text-center text-muted mb-4">
        Escribe el correo asociado a tu cuenta y te enviaremos un enlace de recuperación.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <label for="id_correo" class="form-label">Correo</label>
    <input type="email" name="correo" id="id_correo" class="form-control mb-4" required>

    <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
    <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="text-decoration-none">Volver al login</a>
    </div>
</form>

<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
